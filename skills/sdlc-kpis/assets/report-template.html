<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDLC KPI report</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #14181f; --muted: #5b6573; --line: #e3e7ed;
  --green: #17803d; --green-bg: #e4f5ea; --amber: #a15c00; --amber-bg: #fdf0d8;
  --red: #b42318; --red-bg: #fde7e4; --na: #5b6573; --na-bg: #eceff3; --accent: #2d5be3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1319; --card: #171c24; --ink: #e8ecf2; --muted: #9aa5b4; --line: #272e39;
    --green: #4cc27a; --green-bg: #15301f; --amber: #f0b44c; --amber-bg: #33270f;
    --red: #ff8277; --red-bg: #3a1a17; --na: #9aa5b4; --na-bg: #222833; --accent: #7b9bff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.5rem; margin: 0; }
h2 { font-size: 1.15rem; margin: 40px 0 12px; }
h3 { font-size: 1rem; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
header { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between; }
.meta { margin-top: 4px; }
.health { display: flex; align-items: center; gap: 14px; }
.health .big { font-size: 2rem; font-weight: 700; line-height: 1; }
.dots { display: flex; gap: 6px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; }
.dot.green { background: var(--green); color: var(--green); } .dot.amber { background: var(--amber); color: var(--amber); }
.dot.red { background: var(--red); color: var(--red); } .dot.na { background: transparent; color: var(--na); }
.headline { margin: 20px 0 0; font-size: 1.1rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.next { margin-top: 16px; border-left: 4px solid var(--accent); }
.next ol { margin: 8px 0 0; padding-left: 22px; }
.next li { margin: 8px 0; }
.next .tag { font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
@media (max-width: 860px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
.kpi { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; }
.kpi:hover { border-color: var(--accent); }
.kpi .q { color: var(--muted); font-size: .85rem; }
.kpi .value { font-size: 2rem; font-weight: 700; line-height: 1.1; margin-top: 4px; }
.pill { display: inline-block; font-size: .78rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.pill.green { background: var(--green-bg); color: var(--green); } .pill.amber { background: var(--amber-bg); color: var(--amber); }
.pill.red { background: var(--red-bg); color: var(--red); } .pill.na { background: var(--na-bg); color: var(--na); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.trend.better { color: var(--green); } .trend.worse { color: var(--red); } .trend.flat, .trend.na { color: var(--muted); }
svg.spark { width: 100%; height: 36px; display: block; }
svg.spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.spark circle { fill: var(--accent); }
.detail { margin-top: 12px; scroll-margin-top: 16px; }
.detail .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline; }
.detail p { margin: 8px 0; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
@media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
.cols h4 { margin: 0 0 6px; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.cols ul { margin: 0; padding-left: 20px; } .cols li { margin: 6px 0; }
.todo { list-style: none; padding-left: 0 !important; }
.todo li { display: flex; gap: 8px; align-items: flex-start; }
.todo input { margin-top: 5px; }
a { color: var(--accent); }
.notes li { margin: 4px 0; }
details summary { cursor: pointer; font-weight: 600; }
footer { margin-top: 40px; }
@media print { body { background: #fff; } </style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="kpi-data" type="application/json">__KPI_DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('kpi-data').textContent);
  var LABEL = { green: 'On track', amber: 'Watch', red: 'Act now', na: 'No data' };
  var app = document.getElementById('app');

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function pill(status) { return el('span', { class: 'pill ' + status, text: LABEL[status] }); }
  function trendText(k, days) {
    var t = k.trend;
    if (t.dir === 'n/a') return { cls: 'na', text: 'No comparison yet' };
    var arrow = t.dir === 'flat' ? '→' : (k.value > k.prev_value ? '▲' : '▼');
    var word = t.dir === 'flat' ? 'about the same' : (t.dir === 'better' ? 'better' : 'worse');
    var pct = (t.pct === null || t.dir === 'flat') ? '' : ' ' + Math.abs(t.pct) + '%';
    return { cls: t.dir, text: arrow + pct + ' ' + word + ' (was ' + k.prev_display + ')' };
  }
  function spark(values) {
    var pts = values.map(function (v, i) { return { v: v, i: i }; }).filter(function (p) { return p.v !== null; });
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 140 36'); svg.setAttribute('class', 'spark'); svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Weekly trend, last 8 weeks');
    if (pts.length < 2) return svg;
    var max = Math.max.apply(null, pts.map(function (p) { return p.v; })), min = Math.min.apply(null, pts.map(function (p) { return p.v; }));
    var span = max - min || 1;
    var xy = pts.map(function (p) { return [4 + p.i * (132 / 7), 32 - ((p.v - min) / span) * 28]; });
    var line = document.createElementNS(svg.namespaceURI, 'polyline');
    line.setAttribute('points', xy.map(function (a) { return a[0].toFixed(1) + ',' + a[1].toFixed(1); }).join(' '));
    svg.appendChild(line);
    var last = xy[xy.length - 1], c = document.createElementNS(svg.namespaceURI, 'circle');
    c.setAttribute('cx', last[0]); c.setAttribute('cy', last[1]); c.setAttribute('r', 3); svg.appendChild(c);
    return svg;
  }

  // ---- header
  var s = D.summary, counted = s.total - s.na;
  var dots = el('div', { class: 'dots', 'aria-hidden': 'true' }, D.kpis.map(function (k) { return el('span', { class: 'dot ' + k.status }); }));
  app.appendChild(el('header', {}, [
    el('div', {}, [
      el('h1', { text: 'SDLC KPI report' }),
      el('div', { class: 'meta muted', text: D.repo + ' · ' + D.branch + ' · ' + D.period.start + ' to ' + D.period.end + ' (last ' + D.days + ' days vs the ' + D.days + ' before)' })
    ]),
    el('div', { class: 'health' }, [
      el('div', { class: 'big', text: s.green + ' of ' + counted }),
      el('div', {}, [el('div', { text: 'KPIs on track' }), dots])
    ])
  ]));
  app.appendChild(el('p', { class: 'headline', text: D.headline }));
  if (D.summary_text) app.appendChild(el('p', { class: 'muted', text: D.summary_text }));

  // ---- do this next
  if (D.top_actions && D.top_actions.length) {
    var ol = el('ol', {}, D.top_actions.map(function (a) {
      return el('li', {}, [el('span', { class: 'tag', text: a.kpi + ': ' }), a.action]);
    }));
    app.appendChild(el('div', { class: 'card next' }, [el('h3', { text: 'Do this next' }), ol]));
  }

  // ---- cards
  var grid = el('div', { class: 'grid' });
  D.kpis.forEach(function (k) {
    var t = trendText(k, D.days);
    var card = el('a', { class: 'card kpi', href: '#' + k.id }, [
      el('div', { class: 'row' }, [el('h3', { text: k.name }), pill(k.status)]),
      el('div', { class: 'q', text: k.question }),
      el('div', { class: 'value', text: k.display }),
      el('div', { class: 'trend small ' + t.cls, text: t.text }),
      spark(k.series),
      el('div', { class: 'small muted', text: k.sample_label + (k.low_sample ? ' · low sample' : '') })
    ]);
    grid.appendChild(card);
  });
  app.appendChild(grid);

  // ---- details
  app.appendChild(el('h2', { text: 'What is behind each number' }));
  D.kpis.forEach(function (k) {
    var drivers = el('ul', {}, k.drivers.map(function (d) {
      var label = d.url ? el('a', { href: d.url, text: d.label, target: '_blank', rel: 'noopener' }) : el('span', { text: d.label });
      return el('li', {}, [label, d.detail ? el('span', { class: 'muted', text: ' — ' + d.detail }) : null]);
    }));
    var todo = el('ul', { class: 'todo' }, k.actions.map(function (a, i) {
      var id = k.id + '-' + i;
      return el('li', {}, [el('input', { type: 'checkbox', id: id }), el('label', { for: id, text: a })]);
    }));
    var sec = el('section', { class: 'card detail', id: k.id }, [
      el('div', { class: 'top' }, [el('h3', { text: k.name + ' · ' + k.display }), pill(k.status)]),
      el('p', { text: k.meaning }),
      el('p', { class: 'small muted', text: 'Target: ' + k.target + (k.low_sample ? ' Few data points, so treat this as a hint.' : '') }),
      el('div', { class: 'cols' }, [
        el('div', {}, [el('h4', { text: 'What is driving it' }), k.drivers.length ? drivers : el('p', { class: 'muted', text: 'Nothing notable.' })]),
        el('div', {}, [el('h4', { text: 'What to do' }), todo])
      ]),
      el('p', { class: 'small muted', text: 'How it is measured: ' + k.source })
    ]);
    app.appendChild(sec);
  });

  // ---- footer
  var foot = el('footer', { class: 'small muted' });
  if (D.notes && D.notes.length) {
    foot.appendChild(el('h3', { text: 'Data notes' }));
    foot.appendChild(el('ul', { class: 'notes' }, D.notes.map(function (n) { return el('li', { text: n }); })));
  }
  foot.appendChild(el('p', { text: 'Generated ' + D.generated_at + ' from ' + (D.mode === 'github' ? 'GitHub' : 'local git history') + ' data. ' +
    'Statuses use traffic-light targets (on track / watch / act now) based on the DORA research; change them in .sdlc-kpis.json.' }));
  app.appendChild(foot);
})();
</script>
</body>
</html>
